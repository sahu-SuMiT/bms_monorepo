name: Deploy to staging
on:
  push:
    branches:
      - "main"
jobs:
  redepoly_everything:
    name: Deploying the frontend to the staging cluster
    runs-on: ubuntu-latest

    steps:
      -name: SSH to server
      -run: |
          echo "${{secrets.SSH_PRIVATE_KEY}}" &> ~/ssh_key
          echo "${{secrets.KNOWN_HOSTS}}" &> ~/.ssh/known_hosts
          echo "yes" | ssh -i ~/ssh_key ${{secrets.SERVER_USERNAME}}@${{secrets.SERVER_HOST}}
          cd bms_monorepo 
          git pull 
          pnpm install
          pnpm run build
          pm2 restart fe-server
          pm2 restart http-server
          pm2 restart ws-server
        