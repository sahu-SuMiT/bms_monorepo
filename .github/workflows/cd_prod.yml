name: Deploy to staging
on:
  push:
    branches:
      - "main"
jobs:
  redepoly_everything:
    name: Deploying the frontend to the staging cluster
    runs-on: ubuntu-latest

    steps:
      -name: SSH to server
      -run: |
        echo ${{secrets.SSH_PRIVATE_KEY}} > ~/ssh_key
        chmod 600 ~/ssh_key
        ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@20.2.136.203 << 'EOF'
          cd bms_monorepo 
          git pull 
          pnpm install
          pnpm run build
          pm2 restart fe-server
          pm2 restart http-server
          pm2 restart ws-server
        EOF