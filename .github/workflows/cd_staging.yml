name: Deploy to staging
on:
  push:
    branches: ["main"]
jobs:
  redepoly_everything:
    name: Deploying the frontend to the staging cluster
    runs-on: ubuntu-latest

    steps:
      - run: | 
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{secrets.SSH_PRIVATE_KEY}}" &> ~/ssh_key
          chmod 600 ~/ssh_key
          echo "${{secrets.KNOWN_HOSTS}}" &> ~/.ssh/known_hosts
          ssh -i ~/ssh_key ubuntu@20.2.136.203
          pwd
          cd ~/bms_monorepo 
          git pull 
          pnpm install
          pnpm run build
          pm2 restart fe-server
          pm2 restart http-server
          pm2 restart ws-server
      